name: l-lang
version: 0.2.0.0
github: naamanu/l-lang
license: BSD-3-Clause
author: Nana Adjei Manu
maintainer: https://github.com/naamanu
copyright: 2025 Nana Adjei Manu
synopsis: A small, traceable functional language
description: See README.md for the language and supported workflows.
extra-source-files:
- README.md
- CHANGELOG.md
- docs/*.md
data-files:
- examples/programs.json
dependencies:
- base >= 4.19 && < 5
- containers
ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
library:
  source-dirs: src
  dependencies:
  - aeson
  - text
  - scotty
  - directory
  - filepath
executables:
  l-lang-exe:
    main: Main.hs
    source-dirs: app
    ghc-options: [-threaded, -rtsopts, '-with-rtsopts=-N']
    dependencies: [l-lang]
tests:
  l-lang-test:
    main: Spec.hs
    source-dirs: test
    ghc-options: [-threaded, -rtsopts, '-with-rtsopts=-N']
    dependencies:
    - l-lang
    - HUnit
    - QuickCheck
    - aeson
    - text
