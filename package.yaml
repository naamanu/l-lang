name:                l-lang
version:             0.1.0.0
github:              "naamanu/l-lang"
license:             BSD-3-Clause
author:              "Nana Adjei Manu"
maintainer:          "https://github.com/naamanu"
copyright:           "2025 Nana Adjei Manu"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/naamanu/l-lang#readme>

dependencies:
- base >= 4.7 && < 5
- containers
- array
- parsec
- QuickCheck
- hspec
- HUnit
- directory
- filepath
- scotty
- aeson
- text
- vector
- wai-cors
- wai-extra

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  build-tools:
  - alex
  - happy

executables:
  l-lang-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - l-lang

tests:
  l-lang-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - l-lang
